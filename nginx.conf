server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para mejorar tiempos de transferencia
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Endpoint de verificación de salud para AWS ECS y Application Load Balancers
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Servir la aplicación estática
    location / {
        try_files $uri $uri/ /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Caché para recursos estáticos (CSS, JS, iconos, fuentes)
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Manejo de errores 50x
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
