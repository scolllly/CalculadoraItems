name: Build & Deploy to ECS

on:
  push:
    branches:
      - main-aws
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Omitir tests de vitest (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ #
  # CI — Instala dependencias, corre vitest y construye la imagen Docker #
  # ------------------------------------------------------------------ #
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: npm test

      - name: Build Docker image
        run: docker build -t limpiapipas:${{ github.sha }} .

  # ------------------------------------------------------------------ #
  # CD — Push a ECR y force-new-deployment en ECS                       #
  # Solo corre si CI pasó                                               #
  # ------------------------------------------------------------------ #
  cd:
    name: CD
    runs-on: ubuntu-latest
    needs: ci

    env:
      AWS_REGION:    ${{ secrets.AWS_REGION }}
      ECR_REPO_NAME: ${{ vars.PROJECT_NAME != '' && vars.PROJECT_NAME || 'limpiapipas-demo' }}-repo
      ECS_CLUSTER:   ${{ vars.PROJECT_NAME != '' && vars.PROJECT_NAME || 'limpiapipas-demo' }}-cluster
      ECS_SERVICE:   ${{ vars.PROJECT_NAME != '' && vars.PROJECT_NAME || 'limpiapipas-demo' }}-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to ECR
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPO_NAME}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          docker tag "$IMAGE_URI" "${REGISTRY}/${ECR_REPO_NAME}:latest"
          docker push "${REGISTRY}/${ECR_REPO_NAME}:latest"
          echo "image=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster  "$ECS_CLUSTER" \
            --service  "$ECS_SERVICE" \
            --force-new-deployment \
            --region   "$AWS_REGION"

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster  "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region   "$AWS_REGION"

      - name: Deployment summary
        run: |
          echo "### Despliegue exitoso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagen:** ${{ steps.build.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** ${ECS_CLUSTER}" >> $GITHUB_STEP_SUMMARY
          echo "- **Servicio:** ${ECS_SERVICE}" >> $GITHUB_STEP_SUMMARY
